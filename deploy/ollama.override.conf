# systemd drop-in for Ollama on the A100 box.
# Install:
#   sudo systemctl edit ollama        # opens an editor; paste the [Service] block
#   -- OR --
#   sudo install -Dm644 deploy/ollama.override.conf \
#        /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Colocated with the app -> keep Ollama on localhost only (no auth exists).
# KEEP_ALIVE=-1 pins the model resident so there's no ~21GB cold-reload per request.
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_NUM_PARALLEL=2"
